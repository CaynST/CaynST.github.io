name: Angular_DockerImage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  angular_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: npm install
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --output-path=docs

      - name: Move browser files to docs root
        run: |
          if [ -d "docs/browser" ]; then
            mv docs/browser/*.* docs/
          fi

      - name: Docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Download and run the Docker base image
        run: docker run -d --name http_base httpd

      - name: Copy build to the Docker image
        run: docker cp docs/. http_base:/usr/local/apache2/htdocs

      - name: Build the custom Docker image
        run: docker commit --change "ENV MODEL_NAME http_base" http_base ${{ secrets.DOCKER_USER }}/mycv:${{ github.sha }}

      - name: Docker Push commit tag
        run: docker push ${{ secrets.DOCKER_USER }}/mycv:${{ github.sha }}

      - name: Docker Push latest tag
        run: |
          docker tag ${{ secrets.DOCKER_USER }}/mycv:${{ github.sha }} ${{ secrets.DOCKER_USER }}/mycv:latest
          docker push ${{ secrets.DOCKER_USER }}/mycv:latest
