<h2 class="section-title">Habilidades</h2>
<ul class="skills-list">
	<li class="skill" *ngFor="let item of skills;">
		<div class="skill-head">
			<b>{{item.skill}}</b>
			<span class="skill-level">{{item.level}}</span>
		</div>
		<i class="skill-category">{{item.category}}</i>
		<div class="bar-track">
			<div class="bar-fill" [style.width.%]="getLevelPercent(item.level)"></div>
		</div>
	</li>
</ul>
